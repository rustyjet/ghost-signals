<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scroll from Earth to the Moon and Mars, and hear the stories of the machines NASA left there, told with real NASA photos and 3D models."
    />
    <meta name="theme-color" content="#000000" />
    <title>Ghost Signals</title>
    <!-- Icons: NASA's Apollo 11 photo of the Moon (AS11-44-6667), the same picture the start page uses -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Share preview. og:image needs an absolute URL, so add it once the site has its address. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ghost Signals" />
    <meta
      property="og:description"
      content="The stories of the machines NASA left on the Moon and Mars, told by the machines themselves."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Load the 3D mesh decoder from this site instead of Google's CDN, so the demo works offline.
      self.ModelViewerElement = self.ModelViewerElement || {}
      self.ModelViewerElement.dracoDecoderLocation = new URL('draco/', document.baseURI).href
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
